name: CI

# Free GitHub Actions CI. Validates the build/tests (type errors, broken imports,
# build failures) before they reach production.
#
# NOTE: trigger is manual (workflow_dispatch) because this account's private-repo
# Actions minutes are exhausted (GitHub blocks runs as a "billing issue"). Until
# minutes reset / billing is sorted, use the free local equivalent:  bash scripts/check.sh
# To re-enable automatic runs, add back the `push`/`pull_request` triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Dummy values so modules import without a real DB/secrets (engine is lazy).
      DATABASE_URL: postgresql://user:pass@localhost:5432/test
      SECRET_KEY: ci-test-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app main.py
      - name: Tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
